name: CI

# Runs `moon check` + `moon test` for the library, the independent dataflow
# spike, and the checked literate `.mbt.md` examples in the current-Incr and
# Incr Query docs modules, so package contracts and documentation drift guards
# are verified automatically.
#
# The existing spreadsheet-demo deploy workflows are intentionally left alone;
# this workflow only covers library/docs/dataflow verification.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# NEW_MOON_MOD=0 keeps moon on the committed manifests and disables the
# experimental moon.mod auto-migration. Set workspace-wide so every `moon`
# invocation in every step inherits it.
env:
  NEW_MOON_MOD: '0'

jobs:
  library:
    name: Check + Test library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # The repository-local action installs exact, checksum-verified MoonBit
      # artifacts with retries (issues #227 and #229).
      - name: Install MoonBit
        uses: ./.github/actions/install-moonbit

      - name: Verify MoonBit
        run: moon version --all

      - name: moon update
        working-directory: incr
        run: moon update

      - name: moon check
        working-directory: incr
        run: moon check

      - name: moon test
        working-directory: incr
        run: moon test

  docs:
    name: Check + Test docs examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # The repository-local action installs exact, checksum-verified MoonBit
      # artifacts with retries (issues #227 and #229).
      - name: Install MoonBit
        uses: ./.github/actions/install-moonbit

      - name: Verify MoonBit
        run: moon version --all

      - name: moon update
        working-directory: docs
        run: moon update

      # Plain `moon test` does NOT pick up the literate `.mbt.md` examples — each
      # checked file must be passed explicitly. `moon check` exercises `mbt check`
      # blocks (no test body) and `moon test` exercises blocks with test bodies.
      # The docs module is a `moon.work` member alongside `incr/`, so these
      # examples resolve `dowdiness/incr` from the local library source — this is
      # what makes the checks a real drift guard against the working tree.
      - name: Check + test checked literate examples
        working-directory: docs
        run: |
          status=0
          for f in *.mbt.md; do
            echo "::group::$f"
            moon check "$f" || status=1
            moon test "$f" || status=1
            echo "::endgroup::"
          done
          exit $status

  boundaries:
    name: Check architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install MoonBit for compile-negative probes
        uses: ./.github/actions/install-moonbit

      - name: Fetch registry dependencies
        working-directory: incr
        run: moon update

      - name: Engine isolation invariants (incr/cells/internal)
        run: bash scripts/check-engine-isolation.sh

      - name: Boundary checker self-test (known-positive controls)
        run: bash scripts/check-workspace-boundaries-selftest.sh

      - name: Workspace boundary + pin invariants (non-library members)
        run: bash scripts/check-workspace-boundaries.sh

      - name: Documentation boundary checker self-test
        run: bash scripts/check-documentation-boundaries-selftest.sh

      - name: Incr Query boundary self-test
        run: bash incr_query/tools/check-incr-query-boundaries-selftest.sh

      - name: Incr Query physical layout
        run: bash incr_query/tools/check-layout.sh

      - name: Incr Query docs boundary self-test
        run: bash incr_query/tools/check-incr-query-docs-selftest.sh

      - name: Incr Query boundary and negative probes
        run: |
          bash incr_query/tools/check-incr-query-boundaries.sh
          bash incr_query/tools/check-incr-query-negative-probes.sh

      - name: Incr Query K1.6 private evidence
        run: bash incr_query/tools/check-incr-query-k1-6-private-evidence.sh

      - name: Documentation retention and link boundaries
        run: python3 scripts/check-documentation-boundaries.py

  incr-query:
    name: Incr Query ${{ matrix.root }} / ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - incr_query/kernel
          - incr_query/testkit/model
          - incr_query/testkit/fresh
          - incr_query/testkit/incremental_adapter
          - incr_query/testkit/scenarios
          - incr_query/testkit/differential
        target:
          - default
          - native
          - js
          - wasm-gc
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install MoonBit
        uses: ./.github/actions/install-moonbit

      - name: Verify MoonBit
        run: moon version --all

      - name: Fetch registry dependencies
        working-directory: incr
        run: moon update

      - name: Check + test exact K1.1 root/target cell
        run: |
          if [ "${{ matrix.target }}" = default ]; then
            moon check "${{ matrix.root }}"
            moon test "${{ matrix.root }}"
          else
            moon check --target "${{ matrix.target }}" "${{ matrix.root }}"
            moon test --target "${{ matrix.target }}" "${{ matrix.root }}"
          fi

  incr-query-docs:
    name: Incr Query docs / ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - default
          - native
          - js
          - wasm-gc
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Install MoonBit
        uses: ./.github/actions/install-moonbit
      - name: Verify MoonBit
        run: moon version --all
      - name: Fetch registry dependencies
        working-directory: incr
        run: moon update
      - name: Check public-only executable docs
        run: ./incr_query/tools/check-incr-query-docs.sh "${{ matrix.target }}"

  incr-query-distribution:
    name: Incr Query distribution candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Install candidate packager MoonBit
        uses: ./.github/actions/install-moonbit
      - name: Preserve candidate packager MoonBit
        run: cp -a "$HOME/.moon" /tmp/moonbit-k2-3-packager
      - name: Install MoonBit 0.10.4 compatibility consumer
        uses: ./.github/actions/install-moonbit
        env:
          MOON_HOME: /tmp/moonbit-k2-3-compat
        with:
          version: 0.10.4+ade96c819
          binary-sha256: 5cce093c6795211fcade5e5ff697d88ec4ff416d2785197f004188aca724a753
          core-sha256: e2bf3cc765412055242384fb72a618b62ad4889eae11956251ff921839d022d2
      - name: Verify K2.3 toolchains
        run: |
          /tmp/moonbit-k2-3-packager/bin/moon version --all
          moon version --all
      - name: Check current-toolchain candidate consumer
        env:
          MOON_BIN: /tmp/moonbit-k2-3-packager/bin/moon
          INCR_QUERY_K23_OUTPUT_DIR: /tmp/incr-query-k2-3-current
        run: ./incr_query/tools/check-incr-query-k2-3-distribution.sh
      - name: Check 0.10.4 compatibility consumer and package policy
        env:
          MOON_BIN: /tmp/moonbit-k2-3-packager/bin/moon
          INCR_QUERY_K23_CONSUMER_MOON_BIN: /tmp/moonbit-k2-3-compat/bin/moon
          INCR_QUERY_K23_POLICY_PROBE_MOON_BIN: /tmp/moonbit-k2-3-compat/bin/moon
          INCR_QUERY_K23_OUTPUT_DIR: /tmp/incr-query-k2-3-pinned
        run: ./incr_query/tools/check-incr-query-k2-3-distribution.sh
      - name: Check distribution boundary negative controls
        env:
          MOON_BIN: /tmp/moonbit-k2-3-packager/bin/moon
        run: ./incr_query/tools/check-incr-query-k2-3-distribution-selftest.sh

  incr-query-rc:
    name: Incr Query native RC ownership
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Install MoonBit
        uses: ./.github/actions/install-moonbit
      - name: Fetch registry dependencies
        working-directory: incr
        run: moon update
      - name: Run native RC harness
        run: moon run --target native incr_query/kernel/native_rc

  incr-query-interface:
    name: Incr Query fmt/info/interface clean
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Install MoonBit
        uses: ./.github/actions/install-moonbit
      - name: Fetch registry dependencies
        working-directory: incr
        run: moon update
      - name: Check formatting and generated interfaces
        run: |
          moon fmt incr_query/kernel incr_query/testkit incr_query/docs
          moon info incr_query/kernel incr_query/testkit incr_query/docs
          test -z "$(git status --short -- incr_query/kernel incr_query/testkit incr_query/docs)"
          git diff --check

  incr-query-required:
    name: Incr Query Required
    if: ${{ always() }}
    needs: [incr-query, incr-query-docs, incr-query-distribution, boundaries, incr-query-rc, incr-query-interface]
    runs-on: ubuntu-latest
    steps:
      - name: Require Incr Query matrix and boundaries
        run: |
          test "${{ needs['incr-query'].result }}" = success
          test "${{ needs['incr-query-docs'].result }}" = success
          test "${{ needs['incr-query-distribution'].result }}" = success
          test "${{ needs.boundaries.result }}" = success
          test "${{ needs['incr-query-rc'].result }}" = success
          test "${{ needs['incr-query-interface'].result }}" = success

  docs-ratios:
    name: Verify perf ratio tables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Verify TEA inactive-root cohort ratios
        run: |
          python3 scripts/verify-perf-ratios.py \
            --shared docs/performance/2026-06-15-incr-tea-inactive-root-cohorts.md \
            --independent docs/performance/2026-06-16-incr-tea-independent-inactive-root-cohorts.md \
            --synthesis docs/performance/2026-06-16-incr-tea-shared-vs-independent-inactive-root-cohorts.md \
            --verify

  # Non-library workspace members are checked in workspace mode (no
  # MOON_WORK=off), with sibling-member deps resolved through the
  # workspace — so an incr/ API break that reaches an example fails here in the
  # same PR, and the demos that depend on `examples/typed_spreadsheet` still
  # resolve.
  #
  # Why per-package paths instead of a bare `moon test`: in this workspace a bare
  # `moon test` from a member dir runs the incr module, not the member; and
  # `moon test <module-path>` runs only that module's ROOT package (missing e.g.
  # `typed_spreadsheet/tests`). So we enumerate every package dir under the
  # member and check+test each explicitly. Passing the path keeps resolution in
  # workspace mode (local incr) — the same mechanism the `docs` job relies on.
  #
  # `examples/spikes/ideal_api_rename_phase0` is intentionally NOT gated: a
  # publish-excluded, frozen language-mechanics probe with no tests.
  examples:
    name: Check + Test ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dataflow correctness spike
            path: dataflow
            args: ''
          - name: example typed_spreadsheet
            path: examples/typed_spreadsheet
            args: ''
          - name: example typed_spreadsheet_demo
            path: examples/typed_spreadsheet_demo
            args: ''
          - name: example typed_spreadsheet_cli_demo
            path: examples/typed_spreadsheet_cli_demo
            args: ''
          - name: example typed_spreadsheet_rabbita_demo
            path: examples/typed_spreadsheet_rabbita_demo
            args: '--target js'
          - name: example typed_spreadsheet_incr_tea_demo
            path: examples/typed_spreadsheet_incr_tea_demo
            args: '--target js'
          - name: incr_tea framework
            path: incr_tea
            args: '--target js'
          - name: example incr_tea
            path: examples/incr_tea
            args: '--target js'
          - name: example incr_tea_7guis
            path: examples/incr_tea_7guis
            args: '--target js'
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # See the library job for the verified pin and retry rationale.
      - name: Install MoonBit
        uses: ./.github/actions/install-moonbit

      - name: Verify MoonBit
        run: moon version --all

      - name: moon update
        run: moon update

      # Check + test every package directory under the member. Workspace mode
      # (no MOON_WORK=off) resolves incr from the local source and sibling
      # members from the workspace. `--target js` is applied for js-only members.
      - name: Check + test member packages
        run: |
          status=0
          pkgs=$(find "${{ matrix.path }}" -name moon.pkg \
            -not -path '*/_build/*' -not -path '*/.mooncakes/*' -exec dirname {} \;)
          for p in $pkgs; do
            echo "::group::$p"
            moon check ${{ matrix.args }} "$p" || status=1
            moon test ${{ matrix.args }} "$p" || status=1
            echo "::endgroup::"
          done
          exit $status

  #-------------------------------------------------------------------------------
  # DOM (Playwright) structural test for the incr_tea machine-composition driver
  #-------------------------------------------------------------------------------
  # Timing remains a manually recorded benchmark. This job makes the deterministic
  # semantic-identity, mutation-locality, and stale-result gates permanent.
  incr_tea-machine-composition-dom:
    name: DOM test incr_tea machine composition
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install MoonBit
        uses: ./.github/actions/install-moonbit

      - name: Verify MoonBit
        run: moon version --all

      - name: moon update
        run: moon update

      - name: Install npm dependencies
        working-directory: examples/incr_tea
        run: npm ci

      - name: Install Playwright chromium + system deps
        working-directory: examples/incr_tea
        run: npx playwright install chromium --with-deps

      - name: Run machine-composition structural DOM test
        working-directory: examples/incr_tea
        run: npm run test:machine-composition

  #-------------------------------------------------------------------------------
  # DOM (Playwright) test for the incr_tea 7GUIs example
  #-------------------------------------------------------------------------------
  # Exercises the full build pipeline (MoonBit JS release + Vite bundling) then
  # runs real browser interactions against the served bundle via Playwright.
  # This is kept separate from the examples matrix because it requires npm
  # dependencies, a Vite build step, and system-level browser setup.
  incr_tea_7guis-dom:
    name: DOM test incr_tea_7guis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # See the library job for the verified pin and retry rationale.
      - name: Install MoonBit
        uses: ./.github/actions/install-moonbit

      - name: Verify MoonBit
        run: moon version --all

      - name: moon update
        run: moon update

      - name: Install npm dependencies
        working-directory: examples/incr_tea_7guis
        run: npm ci

      - name: Build MoonBit release JS
        working-directory: examples/incr_tea_7guis
        run: npm run build:moonbit

      - name: Build Vite bundle
        working-directory: examples/incr_tea_7guis
        run: npx vite build

      - name: Install Playwright chromium + system deps
        working-directory: examples/incr_tea_7guis
        run: npx playwright install chromium --with-deps

      - name: Run Playwright DOM test
        working-directory: examples/incr_tea_7guis
        run: node scripts/test-dom.mjs

  #-------------------------------------------------------------------------------
  # Same-origin two-page typed spreadsheet collaboration proof
  #-------------------------------------------------------------------------------
  typed-sheet-collab-dom:
    name: DOM test typed spreadsheet collaboration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install MoonBit
        uses: ./.github/actions/install-moonbit

      - name: Verify MoonBit
        run: moon version --all

      - name: moon update
        run: moon update

      - name: Install npm dependencies
        working-directory: examples/typed_spreadsheet_incr_tea_demo
        run: npm ci

      - name: Install Playwright chromium + system deps
        working-directory: examples/typed_spreadsheet_incr_tea_demo
        run: npx playwright install chromium --with-deps

      - name: Build typed spreadsheet demo
        working-directory: examples/typed_spreadsheet_incr_tea_demo
        run: npm run build

      - name: Static smoke check
        working-directory: examples/typed_spreadsheet_incr_tea_demo
        run: npm run smoke

      - name: Standalone DOM test
        working-directory: examples/typed_spreadsheet_incr_tea_demo
        run: npm run test:dom

      - name: Same-origin collaboration DOM test
        working-directory: examples/typed_spreadsheet_incr_tea_demo
        run: npm run test:collab

  #-------------------------------------------------------------------------------
  # Cloudflare Worker + Durable Object collaboration proof
  #-------------------------------------------------------------------------------
  typed-sheet-cloudflare-collab:
    name: Cloudflare typed spreadsheet collaboration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install MoonBit
        uses: ./.github/actions/install-moonbit

      - name: Verify MoonBit
        run: moon version --all

      - name: moon update
        run: moon update

      - name: Install demo dependencies
        working-directory: examples/typed_spreadsheet_incr_tea_demo
        run: npm ci

      - name: Install Worker dependencies
        working-directory: examples/typed_spreadsheet_incr_tea_demo/cloudflare_worker
        run: npm ci

      - name: Run Durable Object Hibernation test
        working-directory: examples/typed_spreadsheet_incr_tea_demo/cloudflare_worker
        run: npm run test:hibernation

      - name: Install Playwright chromium + system deps
        working-directory: examples/typed_spreadsheet_incr_tea_demo/cloudflare_worker
        run: npx playwright install chromium --with-deps

      - name: Run independent-context Worker collaboration test
        working-directory: examples/typed_spreadsheet_incr_tea_demo/cloudflare_worker
        run: npm run test:e2e

      - name: Run join-first Worker collaboration test
        working-directory: examples/typed_spreadsheet_incr_tea_demo/cloudflare_worker
        run: npm run test:e2e:join-first
