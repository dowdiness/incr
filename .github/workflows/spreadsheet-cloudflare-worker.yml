name: Typed spreadsheet Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spreadsheet-cloudflare-worker.yml'
      - 'moon.work'
      - 'incr/**'
      - 'examples/typed_spreadsheet/**'
      - 'examples/typed_spreadsheet_demo/**'
      - 'examples/typed_spreadsheet_incr_tea_demo/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEW_MOON_MOD: '0'

jobs:
  deploy:
    name: Build and deploy typed spreadsheet Worker
    runs-on: ubuntu-latest
    environment: cloudflare-worker
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install MoonBit
        env:
          MOONBIT_INSTALL_VERSION: 0.10.4+ade96c819
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/moonbit-install.sh
          bash /tmp/moonbit-install.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Verify MoonBit
        run: moon version --all

      - name: moon update
        run: moon update

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            examples/typed_spreadsheet_incr_tea_demo/package-lock.json
            examples/typed_spreadsheet_incr_tea_demo/cloudflare_worker/package-lock.json

      - name: Install demo dependencies
        working-directory: examples/typed_spreadsheet_incr_tea_demo
        run: npm ci

      - name: Install Worker dependencies
        working-directory: examples/typed_spreadsheet_incr_tea_demo/cloudflare_worker
        run: npm ci

      - name: Build Worker and static assets
        working-directory: examples/typed_spreadsheet_incr_tea_demo/cloudflare_worker
        run: npm run build

      - name: Verify Cloudflare configuration
        env:
          CLOUDFLARE_API_TOKEN_VALUE: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_VALUE: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN_VALUE" || {
            echo "::error::Set CLOUDFLARE_API_TOKEN in the cloudflare-worker environment."; exit 1;
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID_VALUE" || {
            echo "::error::Set CLOUDFLARE_ACCOUNT_ID in the cloudflare-worker environment."; exit 1;
          }
          test -n "${{ vars.CLOUDFLARE_WORKER_URL }}" || {
            echo "::error::Set CLOUDFLARE_WORKER_URL in the cloudflare-worker environment."; exit 1;
          }

      - name: Deploy Worker
        working-directory: examples/typed_spreadsheet_incr_tea_demo/cloudflare_worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Run deployed Worker smoke test
        working-directory: examples/typed_spreadsheet_incr_tea_demo/cloudflare_worker
        env:
          SMOKE_BASE_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
        run: npm run smoke:production
